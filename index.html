<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#A6CFE2">
    <title>Purrmodoro 🐾 Study with Melog</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="pixel-bg-canvas"></canvas>

    <div class="app-shell">
        <main class="pomofox-glass-card">
            
            <section id="tab-timer" class="view-panel active">
                
                <div class="top-controls-bar">
                    <button type="button" class="pf-btn-icon btn-orange" id="btn-timer-toggle" title="Start / Pause">▶</button>
                    <button type="button" class="pf-btn-icon btn-dark" id="btn-timer-reset" title="Reset Timer">🔄</button>
                    <button type="button" class="pf-btn-icon btn-orange" id="btn-sound-toggle" title="Mute / Unmute">🔊</button>
                    <button type="button" class="pf-btn-icon btn-dark" id="btn-theme-toggle" title="Dark Mode Toggle">🌙</button>
                </div>

                <div class="biome-tag-bar">
                    <button type="button" class="biome-btn active" data-biome="forest">🌲 Forest</button>
                    <button type="button" class="biome-btn" data-biome="mountain">🏔️ Peak</button>
                    <button type="button" class="biome-btn" data-biome="sunset">🌅 Sunset</button>
                    <button type="button" class="biome-btn" data-biome="sakura">🌸 Sakura</button>
                </div>

                <div class="medical-select-wrap">
                    <select id="sel-subject" class="med-select"></select>
                    <input type="text" id="ipt-chapter-task" class="med-input" placeholder="Chapter / Target (e.g. Robbins pp. 45-60, OMM Practical)" />
                </div>

                <div class="timer-circle-stage">
                    <svg class="circle-svg" viewBox="0 0 300 300">
                        <circle cx="150" cy="150" r="133" class="circle-bg-ring" />
                        <circle cx="150" cy="150" r="133" class="circle-progress-ring" id="circle-progress-ring" />
                    </svg>

                    <div class="timer-digits-text" id="timer-readout">25:00</div>

                    <div class="orbit-arm" id="orbit-arm">
                        <div class="melog-sprite-box" id="melog-sprite" title="Pet Melog">
                            
                            <svg viewBox="0 0 16 16" class="pixel-melog-svg">
                                <g class="px-cat-master">
                                    <g class="px-balanced-tail">
                                        <rect x="2" y="6" width="2" height="2" fill="#2C1E16" />
                                        <rect x="1" y="5" width="2" height="2" fill="#F4C28D" />
                                        <rect x="0" y="3" width="2" height="2" fill="#D9965B" />
                                        <rect x="-1" y="1" width="2" height="2" fill="#FFFFFF" />
                                    </g>
                                    <g class="px-leg-bl">
                                        <rect x="3.5" y="8" width="1.5" height="4" fill="#D9965B" />
                                        <rect x="3" y="11" width="2.5" height="1" fill="#2C1E16" />
                                    </g>
                                    <g class="px-leg-fl">
                                        <rect x="7.5" y="8" width="1.5" height="4" fill="#D9965B" />
                                        <rect x="7" y="11" width="2.5" height="1" fill="#2C1E16" />
                                    </g>
                                    <g class="px-torso">
                                        <rect x="3" y="6" width="7" height="1" fill="#2C1E16" />
                                        <rect x="2" y="7" width="1" height="3" fill="#2C1E16" />
                                        <rect x="10" y="7" width="1" height="3" fill="#2C1E16" />
                                        <rect x="3" y="10" width="7" height="1" fill="#2C1E16" />
                                        <rect x="3" y="7" width="5" height="3" fill="#F4C28D" />
                                        <rect x="4" y="7" width="1" height="2" fill="#D9965B" />
                                        <rect x="8" y="7" width="2" height="3" fill="#FFFFFF" />
                                    </g>
                                    <g class="px-leg-br">
                                        <rect x="4.5" y="8" width="1.5" height="4" fill="#F4C28D" />
                                        <rect x="4" y="11" width="2.5" height="1" fill="#2C1E16" />
                                    </g>
                                    <g class="px-leg-fr">
                                        <rect x="8.5" y="8" width="1.5" height="4" fill="#F4C28D" />
                                        <rect x="8" y="11" width="2.5" height="1" fill="#2C1E16" />
                                    </g>
                                    <g class="px-head">
                                        <polygon points="7,4 4,0 8,3" fill="#2C1E16" />
                                        <polygon points="7,3 5,1 7,3" fill="#F4C28D" />
                                        <polygon points="7,3 6,2 7,3" fill="#FCAEBA" />
                                        <polygon points="10,4 13,0 9,3" fill="#2C1E16" />
                                        <polygon points="10,3 12,1 10,3" fill="#F4C28D" />
                                        <polygon points="10,3 11,2 10,3" fill="#FCAEBA" />
                                        <rect x="7" y="4" width="6" height="4" fill="#F4C28D" />
                                        <rect x="6" y="4" width="1" height="4" fill="#2C1E16" />
                                        <rect x="13" y="5" width="1" height="3" fill="#2C1E16" />
                                        <rect x="8" y="3" width="4" height="1" fill="#2C1E16" />
                                        <rect x="7" y="8" width="5" height="1" fill="#2C1E16" />
                                        <rect x="9" y="4" width="1" height="1" fill="#D9965B" />
                                        <rect x="10" y="5" width="1" height="1" fill="#2C1E16" />
                                        <rect x="10" y="4" width="1" height="1" fill="#9CBD38" />
                                        <rect x="11" y="6" width="2" height="2" fill="#FFFFFF" />
                                        <rect x="12" y="6" width="1" height="1" fill="#E88894" />
                                    </g>
                                </g>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="bottom-cycle-pill">
                    <span>cycle: <strong id="val-cycle-count">1</strong></span>
                    <div class="tomatoes-row">
                        <span class="tomato-dot active" id="dot-1"></span>
                        <span class="tomato-dot" id="dot-2"></span>
                        <span class="tomato-dot" id="dot-3"></span>
                        <span class="tomato-dot" id="dot-4"></span>
                    </div>
                </div>
            </section>

            <section id="tab-planner" class="view-panel">
                <h2 class="section-heading">🩷 Study Planner</h2>
                <div class="form-col">
                    <div class="form-item">
                        <label for="plan-date">Exam Date</label>
