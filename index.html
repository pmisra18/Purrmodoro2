<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#A6CFE2" />
  <title>Purrmodoro 🐾 Study with Melog</title>
  
  <!-- Pixel Digital Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --card-glass: rgba(255, 255, 255, 0.68);
      --card-glass-border: rgba(255, 255, 255, 0.85);
      --btn-orange: #CF6E3A;
      --btn-orange-shadow: #A34E22;
      --btn-dark: #4A4A4A;
      --btn-dark-shadow: #2C2C2C;
      --text-digits: #313131;
      --ring-white: #FFFFFF;
      --ring-shadow: rgba(0, 0, 0, 0.12);
      
      --font-digital: 'VT323', monospace;
      --font-pixel: 'Silkscreen', monospace;
      --font-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    body.theme-dark {
      --card-glass: rgba(26, 22, 34, 0.72);
      --card-glass-border: rgba(255, 255, 255, 0.15);
      --btn-orange: #D96936;
      --btn-orange-shadow: #8A3614;
      --btn-dark: #2F2A38;
      --btn-dark-shadow: #18151D;
      --text-digits: #FFFFFF;
      --ring-white: #2C2436;
      --ring-shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }

    body {
      font-family: var(--font-pixel);
      color: #313131;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Procedural Pixel Landscape Background */
    #pixel-bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    /* Main Center Floating Glass Card */
    .pomofox-glass-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      background: var(--card-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid var(--card-glass-border);
      border-radius: 36px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
      padding: 1.5rem 1.25rem 1.25rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    /* Top Action Buttons (Exact Round-Corner 3D Buttons) */
    .top-controls-bar {
      display: flex;
      gap: 0.65rem;
      align-items: center;
    }

    .pf-btn-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #FFFFFF;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .pf-btn-icon:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0px rgba(0,0,0,0.3) !important;
    }

    .btn-orange {
      background: var(--btn-orange);
      box-shadow: 0 4px 0px var(--btn-orange-shadow);
    }

    .btn-dark {
      background: var(--btn-dark);
      box-shadow: 0 4px 0px var(--btn-dark-shadow);
    }

    /* Clean Medical Curriculum Dropdown */
    .medical-select-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .med-select {
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      padding: 0.55rem 0.75rem;
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: 700;
      color: #313131;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    body.theme-dark .med-select {
      background: rgba(20, 16, 26, 0.85);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Central Circle Wheel Stage */
    .timer-circle-stage {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.25rem 0;
    }

    /* SVG White Circular Track */
    .circle-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .circle-bg-ring {
      fill: none;
      stroke: var(--ring-white);
      stroke-width: 22;
      filter: drop-shadow(0px 4px 10px var(--ring-shadow));
    }

    .circle-progress-ring {
      fill: none;
      stroke: #EAA064;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 753.98; /* 2 * PI * 120 */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.5s ease;
    }

    /* Digits in the Center */
    .timer-digits-text {
      font-family: var(--font-digital);
      font-size: 6.2rem;
      font-weight: 700;
      color: var(--text-digits);
      line-height: 1;
      letter-spacing: -2px;
      z-index: 2;
      user-select: none;
    }

    /* Orbit Arm Rotating Melog Around the Circle Track */
    .orbit-arm {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      transition: transform 0.5s ease;
    }

    /* 16-Bit Pixel Melog Sprite Positioned Exactly on Top Edge */
    .melog-sprite-box {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 36px;
      pointer-events: auto;
      cursor: pointer;
    }

    .pixel-melog-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Pixel Art 4-Leg Running Gait */
    .timer-running .leg-f-r { animation: legRunA 0.25s infinite alternate ease-in-out; }
    .timer-running .leg-b-l { animation: legRunA 0.25s infinite alternate ease-in-out 0.04s; }
    .timer-running .leg-f-l { animation: legRunB 0.25s infinite alternate ease-in-out 0.12s; }
    .timer-running .leg-b-r { animation: legRunB 0.25s infinite alternate ease-in-out 0.16s; }
    .timer-running .melog-body { animation: bodyGallop 0.25s infinite alternate ease-in-out; }
    .timer-running .melog-tail { animation: tailBob 0.3s infinite alternate ease-in-out; }

    @keyframes legRunA {
      0% { transform: translate(0, 0); }
      100% { transform: translate(3px, -3px); }
    }
    @keyframes legRunB {
      0% { transform: translate(3px, -3px); }
      100% { transform: translate(-2px, 2px); }
    }
    @keyframes bodyGallop {
      0% { transform: translateY(0); }
      100% { transform: translateY(-2px); }
    }
    @keyframes tailBob {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(12deg); }
    }

    /* Bottom Pill Cycle Counter */
    .bottom-cycle-pill {
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid rgba(0, 0, 0, 0.06);
      border-radius: var(--radius-pill, 999px);
      padding: 0.45rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: #4A4A4A;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    body.theme-dark .bottom-cycle-pill {
      background: rgba(20, 16, 26, 0.88);
      color: #E0E0E0;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .tomatoes-row {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .tomato-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #D1D1D1;
      display: inline-block;
    }

    .tomato-dot.active {
      background: #EAA064;
    }

    /* Modal Styling for Planner & Settings */
    .pf-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .pf-modal.active { display: flex; }

    .pf-modal-box {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 28px;
      padding: 1.5rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    body.theme-dark .pf-modal-box {
      background: #201A28;
      color: #FFFFFF;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: #F0F0F0;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 800;
    }

    body.theme-dark .close-btn {
      background: #332B3E;
      color: #FFFFFF;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .form-item label {
      font-size: 0.72rem;
      font-weight: 800;
      color: #7A7A7A;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
      border: 1.5px solid #E0E0E0;
      font-family: var(--font-ui);
      font-weight: 700;
      outline: none;
    }

    body.theme-dark .form-input {
      background: #17131D;
      color: #FFFFFF;
      border-color: #382F45;
    }

    .btn-submit {
      background: #CF6E3A;
      color: #FFFFFF;
      border: none;
      padding: 0.75rem;
      border-radius: 14px;
      font-family: var(--font-pixel);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 0px #A34E22;
    }

    .btn-submit:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0px #A34E22;
    }
  </style>
</head>
<body>
  <!-- 60 FPS Procedural Pixel Canvas Background -->
  <canvas id="pixel-bg-canvas"></canvas>

  <!-- PomoFox Centerpiece Glass Card -->
  <main class="pomofox-glass-card">
    
    <!-- Top 4-Button Controls Row -->
    <div class="top-controls-bar">
      <button type="button" class="pf-btn-icon btn-orange" id="btn-timer-toggle" title="Start / Pause">▶</button>
      <button type="button" class="pf-btn-icon btn-dark" id="btn-timer-reset" title="Reset Timer">🔄</button>
      <button type="button" class="pf-btn-icon btn-orange" id="btn-sound-toggle" title="Mute / Unmute">🔊</button>
      <button type="button" class="pf-btn-icon btn-dark" id="btn-settings-open" title="Settings &amp; Planner">⚙️</button>
    </div>

    <!-- Medical Subject Selector -->
    <div class="medical-select-wrap">
      <select id="sel-subject" class="med-select"></select>
    </div>

    <!-- Circular Wheel Timer Stage with Melog on the Outer Rim -->
    <div class="timer-circle-stage">
      <svg class="circle-svg" viewBox="0 0 260 260">
        <circle cx="130" cy="130" r="120" class="circle-bg-ring" />
        <circle cx="130" cy="130" r="120" class="circle-progress-ring" id="circle-progress-ring" />
      </svg>

      <!-- Center Countdown Digits -->
      <div class="timer-digits-text" id="timer-readout">25:00</div>

      <!-- Orbit Arm with Exact Pixel Melog Running Sprite -->
      <div class="orbit-arm" id="orbit-arm">
        <div class="melog-sprite-box" id="melog-sprite" title="Pet Melog">
          <svg viewBox="0 0 40 40" class="pixel-melog-svg">
            <g class="melog-rig">
              
              <!-- Tail (Peach ginger with white tip) -->
              <g class="melog-tail">
                <rect x="2" y="16" width="6" height="4" fill="#FFFFFF" stroke="#2C1F18" stroke-width="1"/>
                <rect x="6" y="18" width="6" height="6" fill="#EAA064" stroke="#2C1F18" stroke-width="1"/>
                <rect x="10" y="22" width="6" height="4" fill="#BD7739"/>
              </g>

              <!-- Back Left Leg -->
              <rect class="leg-b-l" x="12" y="26" width="3" height="7" rx="1" fill="#BD7739" stroke="#2C1F18" stroke-width="1"/>
              <!-- Front Left Leg -->
              <rect class="leg-f-l" x="24" y="26" width="3" height="7" rx="1" fill="#BD7739" stroke="#2C1F18" stroke-width="1"/>

              <!-- Main Cat Body -->
              <g class="melog-body">
                <rect x="10" y="18" width="18" height="10" rx="3" fill="#EAA064" stroke="#2C1F18" stroke-width="1"/>
                <!-- White Chest / Bib -->
                <polygon points="22,20 28,24 28,20" fill="#FFFFFF"/>
                <!-- Tabby Flank Stripe -->
                <rect x="15" y="19" width="2" height="6" fill="#BD7739"/>
              </g>

              <!-- Back Right Leg -->
              <rect class="leg-b-r" x="15" y="27" width="3" height="7" rx="1" fill="#EAA064" stroke="#2C1F18" stroke-width="1"/>
              <!-- Front Right Leg -->
              <rect class="leg-f-r" x="27" y="27" width="3" height="7" rx="1" fill="#EAA064" stroke="#2C1F18" stroke-width="1"/>

              <!-- Head -->
              <g class="melog-head">
                <!-- Ears -->
                <polygon points="20,14 18,6 24,10" fill="#EAA064" stroke="#2C1F18" stroke-width="1"/>
                <polygon points="19,12 18,8 22,10" fill="#FCAEBA"/>
                
                <polygon points="27,14 31,6 25,10" fill="#EAA064" stroke="#2C1F18" stroke-width="1"/>
                <polygon points="28,12 30,8 26,10" fill="#FCAEBA"/>

                <!-- Face -->
                <rect x="20" y="12" width="11" height="9" rx="2" fill="#EAA064" stroke="#2C1F18" stroke-width="1"/>
                <!-- Cheeks -->
                <rect x="20" y="17" width="2" height="2" fill="#FFAEC0"/>
                <!-- Hazel Pixel Eye -->
                <rect x="26" y="14" width="2" height="2" fill="#2C1F18"/>
                <rect x="26" y="14" width="1" height="1" fill="#A4C444"/>
                
                <!-- Snout & Whisker -->
                <rect x="30" y="16" width="3" height="3" fill="#FFFFFF" stroke="#2C1F18" stroke-width="1"/>
                <rect x="32" y="16" width="1" height="1" fill="#E88894"/>
              </g>

            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- Bottom Cycle Pill Tracker -->
    <div class="bottom-cycle-pill">
      <span>cycle: <strong id="val-cycle-count">1</strong></span>
      <div class="tomatoes-row" id="tomatoes-row">
        <span class="tomato-dot active"></span>
        <span class="tomato-dot"></span>
        <span class="tomato-dot"></span>
        <span class="tomato-dot"></span>
      </div>
    </div>

  </main>

  <!-- Settings & Medical Planner Modal -->
  <div class="pf-modal" id="settings-modal">
    <div class="pf-modal-box">
      <div class="modal-head">
        <h2 style="font-size:1.15rem; font-family:var(--font-pixel);">⚙️ Settings &amp; Planner</h2>
        <button type="button" class="close-btn" id="btn-modal-close">&times;</button>
      </div>

      <div class="form-grid">
        <div class="form-item">
          <label for="cfg-theme">Theme Mode</label>
          <select id="cfg-theme" class="form-input">
            <option value="light">☀️ Light Pixel Alpine</option>
            <option value="dark">🌙 Dark Midnight Ridge</option>
          </select>
        </div>
        <div class="form-item">
          <label for="cfg-study-min">Focus Duration (Minutes)</label>
          <input type="number" id="cfg-study-min" class="form-input" value="25" min="1" max="90" />
        </div>
        <div class="form-item">
          <label for="cfg-short-min">Short Break (Minutes)</label>
          <input type="number" id="cfg-short-min" class="form-input" value="5" min="1" max="30" />
        </div>
        <div class="form-item">
          <label for="cfg-exam-date">Exam / Target Date</label>
          <input type="date" id="cfg-exam-date" class="form-input" />
        </div>
        <div class="form-item">
          <label for="cfg-pages-left">Material Remaining (Pages / Cards)</label>
          <input type="number" id="cfg-pages-left" class="form-input" value="240" />
        </div>
      </div>

      <button type="button" class="btn-submit" id="btn-save-settings">Save &amp; Apply 🐾</button>
    </div>
  </div>

  <script>
    /* -------------------------------------------------------------
       PURRMODORO - Exact PomoFox Logic & Pixel Engine
       ------------------------------------------------------------- */
    const MEDICAL_SUBJECTS = [
      "📖 Board Prep (COMLEX / USMLE / TrueLearn / UWorld)",
      "🦴 OPP / OMM Practical & Written",
      "🩺 CE (Clinical Education) OSCE & Notes",
      "👥 PBL (Problem-Based Learning)",
      "🫀 Robbins Pathology",
      "⚡ Guyton Physiology",
      "💊 Katzung Pharmacology",
      "🔬 Murray Microbiology",
      "🧬 Abbas Immunology",
      "💀 Moore's Anatomy",
      "🧪 Marks' Biochemistry & Genetics",
      "🧠 Anki Spaced Repetition",
      "✏️ Custom Focus Session"
    ];

    let state = {
      studyMin: 25,
      shortMin: 5,
      longMin: 20,
      mode: 'study', // 'study', 'break'
      timeLeft: 25 * 60,
      totalDuration: 25 * 60,
      isRunning: false,
      intervalId: null,
      cycleCount: 1,
      soundEnabled: true,
      darkMode: false
    };

    const RING_CIRCUMFERENCE = 2 * Math.PI * 120; // 753.98

    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      initUI();
      initCanvas();
      renderTimer();
    });

    function saveState() {
      localStorage.setItem('purrmodoro_pf_save', JSON.stringify({
        studyMin: state.studyMin,
        shortMin: state.shortMin,
        soundEnabled: state.soundEnabled,
        darkMode: state.darkMode,
        cycleCount: state.cycleCount
      }));
    }

    function loadState() {
      const raw = localStorage.getItem('purrmodoro_pf_save');
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          state.studyMin = parsed.studyMin || 25;
          state.shortMin = parsed.shortMin || 5;
          state.soundEnabled = parsed.soundEnabled !== false;
          state.darkMode = !!parsed.darkMode;
          state.cycleCount = parsed.cycleCount || 1;
        } catch (e) {}
      }
      state.timeLeft = state.studyMin * 60;
      state.totalDuration = state.studyMin * 60;
    }

    function initUI() {
      // Populate Subject Dropdown
      const subSelect = document.getElementById('sel-subject');
      if (subSelect) {
        subSelect.innerHTML = '';
        MEDICAL_SUBJECTS.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          subSelect.appendChild(opt);
        });
      }

      // Play/Pause Button
      const toggleBtn = document.getElementById('btn-timer-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', toggleTimer);
      }

      // Reset Button
      const resetBtn = document.getElementById('btn-timer-reset');
      if (resetBtn) {
        resetBtn.addEventListener('click', resetTimer);
      }

      // Sound Toggle
      const soundBtn = document.getElementById('btn-sound-toggle');
      if (soundBtn) {
        soundBtn.addEventListener('click', () => {
          state.soundEnabled = !state.soundEnabled;
          soundBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
          saveState();
        });
      }

      // Settings Modal
      const modal = document.getElementById('settings-modal');
      const openBtn = document.getElementById('btn-settings-open');
      const closeBtn = document.getElementById('btn-modal-close');
      const saveBtn = document.getElementById('btn-save-settings');

      if (openBtn) openBtn.addEventListener('click', () => modal.classList.add('active'));
      if (closeBtn) closeBtn.addEventListener('click', () => modal.classList.remove('active'));

      if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          state.studyMin = parseInt(document.getElementById('cfg-study-min').value, 10) || 25;
          state.shortMin = parseInt(document.getElementById('cfg-short-min').value, 10) || 5;
          state.darkMode = document.getElementById('cfg-theme').value === 'dark';
          
          document.body.classList.toggle('theme-dark', state.darkMode);
          if (!state.isRunning) {
            state.totalDuration = state.studyMin * 60;
            state.timeLeft = state.totalDuration;
          }
          saveState();
          modal.classList.remove('active');
          renderTimer();
        });
      }

      // Apply initial theme
      document.body.classList.toggle('theme-dark', state.darkMode);
      const themeSelect = document.getElementById('cfg-theme');
      if (themeSelect) themeSelect.value = state.darkMode ? 'dark' : 'light';
    }

    function toggleTimer() {
      if (state.isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      state.isRunning = true;
      document.getElementById('btn-timer-toggle').textContent = '⏸';
      
      const sprite = document.getElementById('melog-sprite');
      if (sprite) sprite.classList.add('timer-running');

      state.intervalId = setInterval(() => {
        if (state.timeLeft > 0) {
          state.timeLeft--;
          renderTimer();
        } else {
          completeBlock();
        }
      }, 1000);
    }

    function pauseTimer() {
      state.isRunning = false;
      clearInterval(state.intervalId);
      document.getElementById('btn-timer-toggle').textContent = '▶';
      
      const sprite = document.getElementById('melog-sprite');
      if (sprite) sprite.classList.remove('timer-running');
    }

    function resetTimer() {
      clearInterval(state.intervalId);
      state.isRunning = false;
      document.getElementById('btn-timer-toggle').textContent = '▶';
      
      const sprite = document.getElementById('melog-sprite');
      if (sprite) sprite.classList.remove('timer-running');

      state.totalDuration = (state.mode === 'study' ? state.studyMin : state.shortMin) * 60;
      state.timeLeft = state.totalDuration;
      renderTimer();
    }

    function completeBlock() {
      clearInterval(state.intervalId);
      state.isRunning = false;
      document.getElementById('btn-timer-toggle').textContent = '▶';

      const sprite = document.getElementById('melog-sprite');
      if (sprite) sprite.classList.remove('timer-running');

      playChime();

      if (state.mode === 'study') {
        state.mode = 'break';
        state.totalDuration = state.shortMin * 60;
        state.timeLeft = state.totalDuration;
        state.cycleCount++;
        document.getElementById('val-cycle-count').textContent = state.cycleCount;
        updateCycleDots();
      } else {
        state.mode = 'study';
        state.totalDuration = state.studyMin * 60;
        state.timeLeft = state.totalDuration;
      }
      saveState();
      renderTimer();
    }

    function renderTimer() {
      const m = Math.floor(state.timeLeft / 60);
      const s = state.timeLeft % 60;
      const str = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      
      document.getElementById('timer-readout').textContent = str;
      document.title = `${str} 🐾 Purrmodoro`;

      const progress = (state.totalDuration - state.timeLeft) / state.totalDuration;

      // 1. Fill Circle SVG Ring
      const ringFill = document.getElementById('circle-progress-ring');
      if (ringFill) {
        ringFill.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - progress);
      }

      // 2. Rotate Melog Orbit Arm (0deg -> 360deg along the circle)
      const orbitArm = document.getElementById('orbit-arm');
      if (orbitArm) {
        orbitArm.style.transform = `rotate(${progress * 360}deg)`;
      }
    }

    function updateCycleDots() {
      const dots = document.querySelectorAll('.tomato-dot');
      const activeIdx = (state.cycleCount - 1) % 4;
      dots.forEach((d, i) => {
        d.classList.toggle('active', i <= activeIdx);
      });
    }

    function playChime() {
      if (!state.soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [587.33, 880, 1174.66].forEach((freq, i) => {
          setTimeout(() => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.18, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.35);
          }, i * 120);
        });
      } catch (e) {}
    }

    /* -------------------------------------------------------------
       Pixel Alpine Background Canvas Renderer (Exact PomoFox Scenery)
       ------------------------------------------------------------- */
    function initCanvas() {
      const canvas = document.getElementById('pixel-bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h;

      const resize = () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      };
      window.addEventListener('resize', resize);
      resize();

      function drawPixelTree(x, y, scale, dark) {
        ctx.fillStyle = dark ? '#18382B' : '#2D5E43';
        ctx.fillRect(x, y, 6 * scale, 30 * scale); // Trunk
        ctx.fillStyle = dark ? '#0F291E' : '#1C4A32';
        
        // Pine Needles (Stepped Pixels)
        for (let i = 0; i < 4; i++) {
          let tierW = (24 - i * 4) * scale;
          let tierH = 8 * scale;
          ctx.fillRect(x - tierW / 2 + 3 * scale, y - i * 7 * scale - 4 * scale, tierW, tierH);
        }
      }

      function renderScenery() {
        ctx.clearRect(0, 0, w, h);
        const dark = state.darkMode;

        // 1. Sky Gradient
        let sky = ctx.createLinearGradient(0, 0, 0, h);
        if (dark) {
          sky.addColorStop(0, '#0C111D');
          sky.addColorStop(0.7, '#182438');
          sky.addColorStop(1, '#253B56');
        } else {
          sky.addColorStop(0, '#7AB8D6');
          sky.addColorStop(0.55, '#A6D5E2');
          sky.addColorStop(1, '#D8EBF2');
        }
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        // 2. Distant Pixel Mountains
        ctx.fillStyle = dark ? '#101B2B' : '#7298B3';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.45);
        for (let x = 0; x <= w; x += 40) {
          let my = h * 0.45 - ((x % 160 === 0) ? 90 : (x % 80 === 0) ? 50 : 20);
          ctx.lineTo(x, my);
          ctx.lineTo(x + 40, my);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.fill();

        // 3. Dense Pine Forest Backdrop (Left & Right)
        for (let x = 0; x < w * 0.35; x += 28) {
          drawPixelTree(x, h * 0.65 + (x % 3) * 12, 1.4, dark);
        }
        for (let x = w * 0.65; x < w; x += 28) {
          drawPixelTree(x, h * 0.65 + (x % 3) * 12, 1.4, dark);
        }

        requestAnimationFrame(renderScenery);
      }
      renderScenery();
    }
  </script>
