<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#A6CFE2" />
  <title>Purrmodoro 🐾 Study with Melog</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --card-glass: rgba(255, 255, 255, 0.76);
      --card-glass-border: rgba(255, 255, 255, 0.95);
      --btn-orange: #D9733E;
      --btn-orange-shadow: #A84E20;
      --btn-dark: #4A4A4A;
      --btn-dark-shadow: #2C2C2C;
      --text-digits: #2B1E16;
      --ring-white: #FFFFFF;
      --ring-shadow: rgba(0, 0, 0, 0.14);
      --dock-bg: rgba(255, 255, 255, 0.92);
      --dock-border: rgba(0, 0, 0, 0.12);
      
      --font-digital: 'VT323', monospace;
      --font-pixel: 'Silkscreen', monospace;
      --font-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    body.theme-dark {
      --card-glass: rgba(26, 20, 34, 0.78);
      --card-glass-border: rgba(255, 255, 255, 0.15);
      --btn-orange: #E06F38;
      --btn-orange-shadow: #8A3714;
      --btn-dark: #32283D;
      --btn-dark-shadow: #1A1422;
      --text-digits: #FFFFFF;
      --ring-white: #2C2238;
      --ring-shadow: rgba(0, 0, 0, 0.55);
      --dock-bg: rgba(26, 20, 34, 0.92);
      --dock-border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }

    body {
      font-family: var(--font-pixel);
      color: #2B1E16;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #pixel-bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      padding: 0.75rem 1rem 5.5rem 1rem;
    }

    /* Centerpiece Frosted Card */
    .pomofox-glass-card {
      width: 100%;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2.5px solid var(--card-glass-border);
      border-radius: 36px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
      padding: 1.25rem 1.25rem 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }

    .view-panel {
      display: none;
      width: 100%;
    }

    .view-panel.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .top-controls-bar {
      display: flex;
      gap: 0.65rem;
      align-items: center;
    }

    .pf-btn-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: #FFFFFF;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .pf-btn-icon:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0px rgba(0,0,0,0.3) !important;
    }

    .btn-orange {
      background: var(--btn-orange);
      box-shadow: 0 4px 0px var(--btn-orange-shadow);
    }

    .btn-dark {
      background: var(--btn-dark);
      box-shadow: 0 4px 0px var(--btn-dark-shadow);
    }

    .medical-select-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .med-select, .med-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      padding: 0.45rem 0.75rem;
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: 700;
      color: #313131;
      outline: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    body.theme-dark .med-select,
    body.theme-dark .med-input {
      background: rgba(18, 14, 24, 0.88);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .biome-tag-bar {
      display: flex;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      padding: 0.2rem 0.45rem;
      border: 1.5px solid rgba(0, 0, 0, 0.05);
    }

    body.theme-dark .biome-tag-bar {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .biome-btn {
      background: transparent;
      border: none;
      font-family: var(--font-pixel);
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      cursor: pointer;
      color: #555;
    }

    body.theme-dark .biome-btn { color: #BBB; }

    .biome-btn.active {
      background: var(--btn-orange);
      color: #FFFFFF;
    }

    /* Enlarged Central Circle Wheel */
    .timer-circle-stage {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.1rem 0;
    }

    .circle-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .circle-bg-ring {
      fill: none;
      stroke: var(--ring-white);
      stroke-width: 26;
      filter: drop-shadow(0px 6px 12px var(--ring-shadow));
    }

    .circle-progress-ring {
      fill: none;
      stroke: #EAA064;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 867.08;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.5s ease;
    }

    .timer-digits-text {
      font-family: var(--font-digital);
      font-size: 7.4rem;
      font-weight: 700;
      color: var(--text-digits);
      line-height: 1;
      letter-spacing: -2px;
      z-index: 2;
      user-select: none;
    }

    /* Orbit Arm */
    .orbit-arm {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      transition: transform 0.5s ease;
    }

    .melog-sprite-box {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 48px;
      pointer-events: auto;
      cursor: pointer;
    }

    .pixel-melog-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      shape-rendering: crispEdges;
    }

    /* ================= SEAMLESS PIXEL TROT (ZERO LEG DETACHMENT) ================= */
    .timer-running .px-cat-master {
      animation: catHopBounding 0.52s infinite cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 8px 11px;
    }

    .timer-running .px-leg-fl {
      animation: strideFrontLeft 0.52s infinite cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 8px 8px;
    }
    .timer-running .px-leg-fr {
      animation: strideFrontRight 0.52s infinite cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 8px 8px;
    }
    .timer-running .px-leg-bl {
      animation: strideBackLeft 0.52s infinite cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 4px 8px;
    }
    .timer-running .px-leg-br {
      animation: strideBackRight 0.52s infinite cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 4px 8px;
    }

    .timer-running .px-tail {
      animation: tailSwayPhysics 0.52s infinite ease-in-out;
      transform-origin: 3px 6px;
    }

    @keyframes catHopBounding {
      0% { transform: translateY(0) rotate(0deg); }
      22% { transform: translateY(-3.5px) rotate(4deg); }
      48% { transform: translateY(-4.2px) rotate(1deg); }
      75% { transform: translateY(-1px) rotate(-3deg); }
      88% { transform: translateY(0.4px) scaleY(0.96); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    @keyframes strideFrontLeft {
      0% { transform: rotate(-16deg); }
      35% { transform: rotate(24deg); }
      70% { transform: rotate(-6deg); }
      100% { transform: rotate(-16deg); }
    }
    @keyframes strideFrontRight {
      0% { transform: rotate(22deg); }
      35% { transform: rotate(-14deg); }
      70% { transform: rotate(12deg); }
      100% { transform: rotate(22deg); }
    }
    @keyframes strideBackLeft {
      0% { transform: rotate(20deg); }
      35% { transform: rotate(-16deg); }
      70% { transform: rotate(8deg); }
      100% { transform: rotate(20deg); }
    }
    @keyframes strideBackRight {
      0% { transform: rotate(-14deg); }
      35% { transform: rotate(22deg); }
      70% { transform: rotate(-4deg); }
      100% { transform: rotate(-14deg); }
    }
    @keyframes tailSwayPhysics {
      0% { transform: rotate(-3deg); }
      45% { transform: rotate(15deg); }
      80% { transform: rotate(-1deg); }
      100% { transform: rotate(-3deg); }
    }

    /* Bottom Cycle Pill */
    .bottom-cycle-pill {
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid rgba(0, 0, 0, 0.06);
      border-radius: 999px;
      padding: 0.35rem 1.15rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: #4A4A4A;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    body.theme-dark .bottom-cycle-pill {
      background: rgba(20, 16, 26, 0.88);
      color: #E0E0E0;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .tomatoes-row {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .tomato-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #D1D1D1;
      display: inline-block;
    }

    .tomato-dot.active { background: #EAA064; }

    .section-heading {
      font-size: 1.15rem;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      text-align: center;
    }

    body.theme-dark .section-heading { color: #FFFFFF; }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
      width: 100%;
    }

    .pf-item-box {
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border-radius: 14px;
      padding: 0.85rem 0.65rem;
      text-align: center;
    }

    body.theme-dark .pf-item-box {
      background: rgba(20, 16, 26, 0.85);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .pf-item-box.locked { opacity: 0.45; border-style: dashed; }

    .btn-adopt {
      background: var(--btn-orange);
      color: #FFFFFF;
      border: none;
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      font-family: var(--font-pixel);
      font-size: 0.72rem;
      margin-top: 0.4rem;
      cursor: pointer;
    }

    .form-col {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      width: 100%;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .form-item label {
      font-size: 0.72rem;
      font-weight: 800;
      color: #666;
      text-transform: uppercase;
    }

    body.theme-dark .form-item label { color: #AAA; }

    .btn-action-wide {
      background: var(--btn-orange);
      box-shadow: 0 4px 0px var(--btn-orange-shadow);
      color: #FFFFFF;
      border: none;
      padding: 0.75rem;
      border-radius: 14px;
      font-family: var(--font-pixel);
      font-size: 0.88rem;
      cursor: pointer;
      width: 100%;
    }

    .btn-action-wide:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0px var(--btn-orange-shadow);
    }

    .week-row-dots {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin: 0.5rem 0;
    }

    .day-square {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.82rem;
    }

    body.theme-dark .day-square {
      background: rgba(20, 16, 26, 0.8);
      color: #FFF;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .day-square.done {
      background: var(--btn-orange);
      color: #FFF;
      border-color: var(--btn-orange-shadow);
    }

    .log-scroll-area {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      max-height: 180px;
      overflow-y: auto;
      width: 100%;
    }

    .log-item-pill {
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      font-size: 0.78rem;
      font-family: var(--font-ui);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    body.theme-dark .log-item-pill {
      background: rgba(20, 16, 26, 0.85);
      color: #FFF;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .pf-bottom-dock {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 440px;
      background: var(--dock-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2.5px solid var(--dock-border);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      padding: 0.35rem;
      display: flex;
      justify-content: space-between;
      z-index: 50;
    }

    .pf-dock-btn {
      flex: 1;
      background: transparent;
      border: none;
      font-family: var(--font-pixel);
      font-weight: 700;
      font-size: 0.65rem;
      color: #666;
      padding: 0.5rem 0.2rem;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      text-transform: uppercase;
      transition: all 0.1s ease;
    }

    body.theme-dark .pf-dock-btn { color: #AAA; }

    .pf-dock-btn.active {
      background: var(--btn-orange);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .dock-ico { font-size: 1.15rem; }
  </style>
</head>
<body>
  <canvas id="pixel-bg-canvas"></canvas>

  <div class="app-shell">
    <main class="pomofox-glass-card">
      
      <!-- ================= TAB 1: TIMER ================= -->
      <section id="tab-timer" class="view-panel active">
        
        <div class="top-controls-bar">
          <button type="button" class="pf-btn-icon btn-orange" id="btn-timer-toggle" title="Start / Pause">▶</button>
          <button type="button" class="pf-btn-icon btn-dark" id="btn-timer-reset" title="Reset Timer">🔄</button>
          <button type="button" class="pf-btn-icon btn-orange" id="btn-sound-toggle" title="Mute / Unmute">🔊</button>
          <button type="button" class="pf-btn-icon btn-dark" id="btn-theme-toggle" title="Dark Mode Toggle">🌙</button>
        </div>

        <!-- 4 Distinct Biomes -->
        <div class="biome-tag-bar">
          <button type="button" class="biome-btn active" data-biome="sakura">🌸 Sakura</button>
          <button type="button" class="biome-btn" data-biome="taiga">🌲 Firefly</button>
          <button type="button" class="biome-btn" data-biome="mountain">🏔️ Snow</button>
          <button type="button" class="biome-btn" data-biome="autumn">🍂 Fall</button>
        </div>

        <div class="medical-select-wrap">
          <select id="sel-subject" class="med-select"></select>
          <input type="text" id="ipt-chapter-task" class="med-input" placeholder="Chapter / Target (e.g. Robbins pp. 45-60, OMM Practical)" />
        </div>

        <!-- Timer Circle Stage -->
        <div class="timer-circle-stage">
          <svg class="circle-svg" viewBox="0 0 300 300">
            <circle cx="150" cy="150" r="138" class="circle-bg-ring" />
            <circle cx="150" cy="150" r="138" class="circle-progress-ring" id="circle-progress-ring" />
          </svg>

          <div class="timer-digits-text" id="timer-readout">25:00</div>

          <!-- Orbit Arm -->
          <div class="orbit-arm" id="orbit-arm">
            <div class="melog-sprite-box" id="melog-sprite" title="Pet Melog">
              
              <!-- 100% PURE 16x16 PIXEL ART WITH FUSED ROTATION ANCHORS -->
              <svg viewBox="0 0 16 16" class="pixel-melog-svg">
                <g class="px-cat-master">
                  
                  <!-- Tail -->
                  <g class="px-tail">
                    <rect x="0" y="3" width="2" height="2" fill="#FFFFFF" />
                    <rect x="1" y="4" width="2" height="2" fill="#F4C28D" />
                    <rect x="2" y="5" width="2" height="2" fill="#D9965B" />
                    <rect x="3" y="6" width="2" height="2" fill="#2C1E16" />
                  </g>

                  <!-- Back Left Leg (Pivot: 4, 8) -->
                  <g class="px-leg-bl">
                    <rect x="3" y="7" width="2" height="2" fill="#D9965B" />
                    <rect x="3" y="9" width="2" height="3" fill="#D9965B" />
                    <rect x="2.5" y="11" width="2.5" height="1" fill="#2C1E16" />
                  </g>

                  <!-- Front Left Leg (Pivot: 8, 8) -->
                  <g class="px-leg-fl">
                    <rect x="7" y="7" width="2" height="2" fill="#D9965B" />
                    <rect x="7" y="9" width="2" height="3" fill="#D9965B" />
                    <rect x="6.5" y="11" width="2.5" height="1" fill="#2C1E16" />
                  </g>

                  <!-- Fused Main Torso Grid -->
                  <g class="px-torso">
                    <rect x="3" y="6" width="7" height="1" fill="#2C1E16" />
                    <rect x="2" y="7" width="1" height="3" fill="#2C1E16" />
                    <rect x="10" y="7" width="1" height="3" fill="#2C1E16" />
                    <rect x="3" y="10" width="7" height="1" fill="#2C1E16" />
                    
                    <rect x="3" y="7" width="5" height="3" fill="#F4C28D" />
                    <rect x="4" y="7" width="1" height="2" fill="#D9965B" />
                    
                    <!-- Solid Ivory Chest Bib -->
                    <rect x="8" y="7" width="2" height="3" fill="#FFFFFF" />
                  </g>

                  <!-- Back Right Leg (Pivot: 4, 8) -->
                  <g class="px-leg-br">
                    <rect x="4" y="7" width="2" height="2" fill="#F4C28D" />
                    <rect x="4" y="9" width="2" height="3" fill="#F4C28D" />
                    <rect x="3.5" y="11" width="2.5" height="1" fill="#2C1E16" />
                  </g>

                  <!-- Front Right Leg (Pivot: 8, 8) -->
                  <g class="px-leg-fr">
                    <rect x="8" y="7" width="2" height="2" fill="#F4C28D" />
                    <rect x="8" y="9" width="2" height="3" fill="#F4C28D" />
                    <rect x="7.5" y="11" width="2.5" height="1" fill="#2C1E16" />
                  </g>

                  <!-- Head & Feline Ears -->
                  <g class="px-head">
                    <rect x="7" y="1" width="2" height="1" fill="#2C1E16" />
                    <rect x="7" y="2" width="2" height="2" fill="#F4C28D" />
                    <rect x="8" y="2" width="1" height="1" fill="#FCAEBA" />

                    <rect x="10" y="1" width="2" height="1" fill="#2C1E16" />
                    <rect x="10" y="2" width="2" height="2" fill="#F4C28D" />
                    <rect x="10" y="2" width="1" height="1" fill="#FCAEBA" />

                    <rect x="7" y="4" width="6" height="4" fill="#F4C28D" />
                    <rect x="6" y="4" width="1" height="4" fill="#2C1E16" />
                    <rect x="13" y="5" width="1" height="3" fill="#2C1E16" />
                    <rect x="8" y="3" width="4" height="1" fill="#2C1E16" />
                    <rect x="7" y="8" width="5" height="1" fill="#2C1E16" />

                    <rect x="9" y="4" width="1" height="1" fill="#D9965B" />
                    <rect x="10" y="5" width="1" height="1" fill="#2C1E16" />
                    <rect x="10" y="4" width="1" height="1" fill="#9CBD38" />

                    <rect x="11" y="6" width="2" height="2" fill="#FFFFFF" />
                    <rect x="12" y="6" width="1" height="1" fill="#E88894" />
                  </g>

                </g>
              </svg>

            </div>
          </div>
        </div>

        <!-- Cycle Tracker -->
        <div class="bottom-cycle-pill">
          <span>cycle: <strong id="val-cycle-count">1</strong></span>
          <div class="tomatoes-row">
            <span class="tomato-dot active" id="dot-1"></span>
            <span class="tomato-dot" id="dot-2"></span>
            <span class="tomato-dot" id="dot-3"></span>
            <span class="tomato-dot" id="dot-4"></span>
          </div>
        </div>

      </section>

      <!-- ================= TAB 2: PLANNER ================= -->
      <section id="tab-planner" class="view-panel">
        <h2 class="section-heading">🩷 Study Planner</h2>
        <div class="form-col">
          <div class="form-item">
            <label for="plan-date">Exam Date</label>

            <label for="cfg-long-min">Long Break</label>
            <input type="number" id="cfg-long-min" class="med-input" value="20" min="5" max="60" />

    <nav class="pf-bottom-dock">
      <button type="button" class="pf-dock-btn active" data-tab="tab-timer">
        <span class="dock-ico">⏱️</span>
        <span>Timer</span>
      </button>
      <button type="button" class="pf-dock-btn" data-tab="tab-planner">
        <span class="dock-ico">🩷</span>
        <span>Planner</span>
      </button>
      <button type="button" class="pf-dock-btn" data-tab="tab-world">
        <span class="dock-ico">🏡</span>
        <span>Store</span>
      </button>
      <button type="button" class="pf-dock-btn" data-tab="tab-stats">
        <span class="dock-ico">📊</span>
        <span>Stats</span>
      </button>
      <button type="button" class="pf-dock-btn" data-tab="tab-settings">
        <span class="dock-ico">⚙️</span>
        <span>Settings</span>
      </button>
    </nav>

  </div>

  <script>
    /* -------------------------------------------------------------
       PURRMODORO - Dedicated Pixel Landscape Engine & Rig
       ------------------------------------------------------------- */
    const MEDICAL_SUBJECTS = [
      "📖 Board Prep (COMLEX / USMLE / TrueLearn / UWorld)",
      "🦴 OPP / OMM Practical & Written",
      "🩺 CE (Clinical Education) OSCE & Notes",
      "👥 PBL (Problem-Based Learning)",
      "🫀 Robbins Pathology",
      "⚡ Guyton Physiology",
      "💊 Katzung Pharmacology",
      "🔬 Murray Microbiology",
      "🧬 Abbas Immunology",
      "💀 Moore's Anatomy",
      "🧪 Marks' Biochemistry & Genetics",
      "🧠 Anki Spaced Repetition",
      "✏️ Custom Focus Session"
    ];

    const WORLD_WINGS = [
      { name: "Melog's Bedroom", icon: '🛏️', reqLevel: 1 },
      { name: "Medical Library", icon: '📚', reqLevel: 5 },
      { name: "Cozy Anatomy Café", icon: '☕', reqLevel: 10 },
      { name: "Pharmacology Green", icon: '🌿', reqLevel: 20 },
      { name: "The Whisker Clinic", icon: '🩺', reqLevel: 35 },
      { name: "Simulation Suite", icon: '🫀', reqLevel: 50 },
      { name: "Stargazer Lounge", icon: '🌙', reqLevel: 75 },
      { name: "Teaching Hospital", icon: '🏥', reqLevel: 100 }
    ];

    const CATALOG_ITEMS = [
      { id: 'tea', name: 'Chamomile Tea', icon: '☕', cost: 20, purchased: false },
      { id: 'yarn', name: "Melog's Wool Ball", icon: '🧶', cost: 50, purchased: false },
      { id: 'plant', name: 'Monstera Plant', icon: '🪴', cost: 100, purchased: false },
      { id: 'steth', name: 'Blush Stethoscope', icon: '🩺', cost: 250, purchased: false },
      { id: 'bones', name: 'Desktop Skeleton', icon: '🦴', cost: 500, purchased: false },
      { id: 'coat', name: "Mini White Coat", icon: '🥼', cost: 1000, purchased: false }
    ];

    let state = {
      settings: { studyMin: 25, shortMin: 5, longMin: 20, longInterval: 4, dailyTarget: 8, soundEnabled: true, darkMode: false, currentBiome: 'sakura' },
      timer: { mode: 'study', timeLeft: 25 * 60, totalDuration: 25 * 60, isRunning: false, intervalId: null },
      game: { xp: 0, level: 1, pawPoints: 0, streak: 1, todayPomodoros: 0, todayMinutes: 0, totalPomodoros: 0, cycleCount: 1, lastActiveDate: getTodayDateString(), activeDays: {}, sessionLogs: [], catalog: [...CATALOG_ITEMS] }
    };

    const RING_CIRCUMFERENCE = 2 * Math.PI * 138; // 867.08

    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      initTheme();
      initTabs();
      initUI();
      initTimer();
      initPlanner();
      initCanvas();
      renderAll();
    });

    function getTodayDateString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function saveState() {
      localStorage.setItem('purrmodoro_pf_master_v3', JSON.stringify(state));
    }

    function loadState() {
      const raw = localStorage.getItem('purrmodoro_pf_master_v3');
      if (raw) {
        try { state = { ...state, ...JSON.parse(raw) }; } catch (e) {}
      }
      state.timer.timeLeft = state.settings.studyMin * 60;
      state.timer.totalDuration = state.settings.studyMin * 60;
    }

    function initTheme() {
      const themeBtn = document.getElementById('btn-theme-toggle');
      document.body.classList.toggle('theme-dark', state.settings.darkMode);
      if (themeBtn) themeBtn.textContent = state.settings.darkMode ? '☀️' : '🌙';

      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          state.settings.darkMode = !state.settings.darkMode;
          document.body.classList.toggle('theme-dark', state.settings.darkMode);
          themeBtn.textContent = state.settings.darkMode ? '☀️' : '🌙';
          saveState();
        });
      }
    }

    function initTabs() {
      const dockBtns = document.querySelectorAll('.pf-dock-btn');
      dockBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          dockBtns.forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));

          btn.classList.add('active');
          const target = document.getElementById(btn.dataset.tab);
          if (target) {
            target.classList.add('active');
            if (btn.dataset.tab === 'tab-world') renderWorld();
            if (btn.dataset.tab === 'tab-stats') renderStats();
          }
        });
      });
    }

    function initUI() {
      const subSelect = document.getElementById('sel-subject');
      if (subSelect) {
        subSelect.innerHTML = '';
        MEDICAL_SUBJECTS.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          subSelect.appendChild(opt);
        });
      }

      document.querySelectorAll('.biome-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.biome === state.settings.currentBiome);
        btn.addEventListener('click', () => {
          document.querySelectorAll('.biome-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.settings.currentBiome = btn.dataset.biome;
          saveState();
        });
      });

      const soundBtn = document.getElementById('btn-sound-toggle');
      if (soundBtn) {
        soundBtn.textContent = state.settings.soundEnabled ? '🔊' : '🔇';
        soundBtn.addEventListener('click', () => {
          state.settings.soundEnabled = !state.settings.soundEnabled;
          soundBtn.textContent = state.settings.soundEnabled ? '🔊' : '🔇';
          saveState();
        });
      }

      const melogSprite = document.getElementById('melog-sprite');
      if (melogSprite) {
        melogSprite.addEventListener('click', () => {
          playTone(587.33, 0.3);
        });
      }

      const settingsForm = document.getElementById('settings-form');
      if (settingsForm) {
        settingsForm.addEventListener('submit', (e) => {
          e.preventDefault();
          state.settings.studyMin = parseInt(document.getElementById('cfg-study-min').value, 10);
          state.settings.shortMin = parseInt(document.getElementById('cfg-short-min').value, 10);
          state.settings.longMin = parseInt(document.getElementById('cfg-long-min').value, 10);
          saveState();
          alert('Settings saved! 🩺');
          document.querySelector('.pf-dock-btn[data-tab="tab-timer"]').click();
        });
      }
    }

    function initTimer() {
      const toggleBtn = document.getElementById('btn-timer-toggle');
      const resetBtn = document.getElementById('btn-timer-reset');

      if (toggleBtn) toggleBtn.addEventListener('click', toggleTimer);
      if (resetBtn) resetBtn.addEventListener('click', resetTimer);
    }

    function toggleTimer() {
      if (state.timer.isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      state.timer.isRunning = true;
      document.getElementById('btn-timer-toggle').textContent = '⏸';
      
      const sprite = document.getElementById('melog-sprite');
      if (sprite) sprite.classList.add('timer-running');

      state.timer.intervalId = setInterval(() => {
        if (state.timer.timeLeft > 0) {
          state.timer.timeLeft--;
          renderTimer();
        } else {
          completeBlock();
        }
      }, 1000);
    }

    function pauseTimer() {
      state.timer.isRunning = false;
      clearInterval(state.timer.intervalId);
      document.getElementById('btn-timer-toggle').textContent = '▶';

      const sprite = document.getElementById('melog-sprite');
      if (sprite) sprite.classList.remove('timer-running');
    }

    function resetTimer() {
      clearInterval(state.timer.intervalId);
      state.timer.isRunning = false;
      document.getElementById('btn-timer-toggle').textContent = '▶';

      const sprite = document.getElementById('melog-sprite');
      if (sprite) sprite.classList.remove('timer-running');

      state.timer.totalDuration = (state.timer.mode === 'study' ? state.settings.studyMin : state.settings.shortMin) * 60;
      state.timer.timeLeft = state.timer.totalDuration;
      renderTimer();
    }

    function completeBlock() {
      clearInterval(state.timer.intervalId);
      state.timer.isRunning = false;
      document.getElementById('btn-timer-toggle').textContent = '▶';

      const sprite = document.getElementById('melog-sprite');
      if (sprite) sprite.classList.remove('timer-running');

      playFanfare();

      if (state.timer.mode === 'study') {
        state.timer.mode = 'shortBreak';
        state.timer.totalDuration = state.settings.shortMin * 60;
        state.timer.timeLeft = state.timer.totalDuration;
        
        state.game.todayPomodoros++;
        state.game.totalPomodoros++;
        state.game.todayMinutes += state.settings.studyMin;
        state.game.pawPoints += 10;
        state.game.xp += 25;
        state.game.cycleCount++;

        const newLevel = Math.floor(state.game.xp / 100) + 1;
        if (newLevel > state.game.level) state.game.level = newLevel;

        const today = getTodayDateString();
        state.game.activeDays[today] = (state.game.activeDays[today] || 0) + 1;

        const sub = document.getElementById('sel-subject').value;
        const task = document.getElementById('ipt-chapter-task').value || 'Focus Session';
        state.game.sessionLogs.unshift({
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          subject: sub,
          task: task,
          minutes: state.settings.studyMin
        });
      } else {
        state.timer.mode = 'study';
        state.timer.totalDuration = state.settings.studyMin * 60;
        state.timer.timeLeft = state.timer.totalDuration;
      }
      saveState();
      renderAll();
    }

    function renderTimer() {
      const m = Math.floor(state.timer.timeLeft / 60);
      const s = state.timer.timeLeft % 60;
      const str = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      
      const readout = document.getElementById('timer-readout');
      if (readout) readout.textContent = str;
      document.title = `${str} 🐾 Purrmodoro`;

      const progress = (state.timer.totalDuration - state.timer.timeLeft) / state.timer.totalDuration;
      const ringFill = document.getElementById('circle-progress-ring');
      if (ringFill) {
        ringFill.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - progress);
      }

      const orbitArm = document.getElementById('orbit-arm');
      if (orbitArm) {
        orbitArm.style.transform = `rotate(${progress * 360}deg)`;
      }
    }

    function renderAll() {
      renderTimer();
      
      const activeDot = (state.game.cycleCount - 1) % 4;
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (dot) dot.classList.toggle('active', i - 1 <= activeDot);
      }
    }

    function renderWorld() {
      const map = document.getElementById('world-map-grid');
      if (map) {
        map.innerHTML = '';
        WORLD_WINGS.forEach(w => {
          const unlocked = state.game.level >= w.reqLevel;
          const div = document.createElement('div');
          div.className = `pf-item-box ${unlocked ? '' : 'locked'}`;
          div.innerHTML = `<div style="font-size:1.6rem;">${w.icon}</div><div style="font-weight:700; font-size:0.75rem; margin-top:0.2rem;">${w.name}</div><div style="font-size:0.65rem; opacity:0.8;">${unlocked ? '✨ Unlocked' : `Req. Lvl ${w.reqLevel}`}</div>`;
          map.appendChild(div);
        });
      }

      const cat = document.getElementById('furniture-catalog-grid');
      if (cat) {
        cat.innerHTML = '';
        state.game.catalog.forEach(item => {
          const div = document.createElement('div');
          div.className = `pf-item-box ${item.purchased ? '' : 'locked'}`;
          div.innerHTML = `<div style="font-size:1.6rem;">${item.icon}</div><div style="font-weight:700; font-size:0.75rem;">${item.name}</div><div style="font-size:0.75rem; font-weight:800; color:var(--btn-orange);">${item.purchased ? 'Owned 🎀' : `${item.cost} 🐾`}</div>${!item.purchased ? `<button type="button" class="btn-adopt">Adopt</button>` : ''}`;
          if (!item.purchased) {
            div.querySelector('button').addEventListener('click', () => {
              if (state.game.pawPoints >= item.cost) {
                state.game.pawPoints -= item.cost;
                item.purchased = true;
                saveState();
                renderWorld();
                alert(`Adopted ${item.name}! Melog loves it! ✨`);
              } else alert(`Need ${item.cost - state.game.pawPoints} more 🐾 Paw Points!`);
            });
          }
          cat.appendChild(div);
        });
      }
    }

    function renderStats() {
      const streakHeader = document.getElementById('txt-stats-streak');
      if (streakHeader) streakHeader.textContent = `${state.game.streak} Day Streak`;

      const row = document.getElementById('weekly-tracker-row');
      if (row) {
        row.innerHTML = '';
        const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        const today = new Date();
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(today.getDate() - i);
          const dStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          const done = (state.game.activeDays[dStr] || 0) > 0;
          const div = document.createElement('div');
          div.style.display = 'flex';
          div.style.flexDirection = 'column';
          div.style.alignItems = 'center';
          div.style.gap = '0.25rem';
          div.innerHTML = `<span style="font-size:0.7rem; font-weight:700;">${days[d.getDay()]}</span><div class="day-square ${done ? 'done' : ''}">${done ? '✓' : ''}</div>`;
          row.appendChild(div);
        }
      }

      const list = document.getElementById('session-log-list');
      if (list) {
        list.innerHTML = '';
        if (state.game.sessionLogs.length === 0) {
          list.innerHTML = `<div style="text-align:center; padding:0.8rem; font-size:0.75rem; opacity:0.7;">No study sessions logged today yet.</div>`;
        } else {
          state.game.sessionLogs.slice(0, 8).forEach(log => {
            const item = document.createElement('div');
            item.className = 'log-item-pill';
            item.innerHTML = `<div><strong>${escapeHTML(log.subject)}</strong> &mdash; ${escapeHTML(log.task)}</div><div>${log.time} (${log.minutes}m)</div>`;
            list.appendChild(item);
          });
        }
      }
    }

    function initPlanner() {
      const calc = document.getElementById('btn-calc-schedule');
      if (calc) {
        calc.addEventListener('click', () => {
          const dateVal = document.getElementById('plan-date').value;
          const buffer = parseInt(document.getElementById('plan-buffer').value, 10) || 0;
          const amount = parseFloat(document.getElementById('plan-amount').value) || 0;
          const unit = document.getElementById('plan-unit').value;
          const pace = parseFloat(document.getElementById('plan-pace').value) || 1;

          if (!dateVal) return alert('Please enter an exam date.');

          const diffDays = Math.ceil((new Date(dateVal) - new Date()) / (1000 * 60 * 60 * 24));
          const studyDays = Math.max(diffDays - buffer, 1);
          const dailyUnits = Math.ceil(amount / studyDays);
          const dailyPomos = Math.ceil(dailyUnits / pace);

          document.getElementById('rx-content').innerHTML = `<p>📚 <strong>Remaining:</strong> ${amount} ${unit}</p><p>🗓️ <strong>Study Days:</strong> ${studyDays} days (${buffer} buffer days)</p><p>🎀 <strong>Daily Target:</strong> <strong>${dailyUnits} ${unit}/day</strong></p><p>🐱 <strong>Focus Blocks:</strong> <strong>${dailyPomos} Pomodoros/day</strong></p>`;
          document.getElementById('rx-card').style.display = 'block';

          const applyBtn = document.getElementById('btn-apply-plan-goal');
          if (applyBtn) {
            applyBtn.onclick = () => {
              state.settings.dailyTarget = dailyPomos;
              saveState();
              alert(`Daily goal updated to ${dailyPomos} Pomodoros! 🌸`);
              document.querySelector('.pf-dock-btn[data-tab="tab-timer"]').click();
            };
          }
        });
      }
    }

    /* -------------------------------------------------------------
       4 TRULY UNIQUE PROCEDURAL PIXEL BIOME ENGINE
       ------------------------------------------------------------- */
    function initCanvas() {
      const canvas = document.getElementById('pixel-bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h;
      let tick = 0;

      const resize = () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      };
      window.addEventListener('resize', resize);
      resize();

      // Dynamic Particle Pools for Biomes
      let particles = Array.from({ length: 45 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 3 + 2,
        vx: (Math.random() - 0.5) * 0.8,
        vy: Math.random() * 0.6 + 0.4,
        pulse: Math.random() * Math.PI * 2,
        rot: Math.random() * Math.PI
      }));

      // 🌸 Sakura Swaying Tree
      function drawSwayingSakura(x, y, scale, sway) {
        ctx.fillStyle = '#4A2A20';
        ctx.fillRect(x, y, 8 * scale, 34 * scale); // Trunk
        
        // Swaying Pixel Canopy
        const blossomDark = '#E58A9F';
        const blossomLight = '#FFB5C5';
        const shift = Math.sin(sway) * 4 * scale;

        for (let i = 0; i < 4; i++) {
          let bW = (32 - i * 6) * scale;
          let bH = 12 * scale;
          let bY = y - i * 8 * scale - 6 * scale;
          let bX = x - bW / 2 + 4 * scale + shift * (i * 0.3);
          ctx.fillStyle = blossomDark;
          ctx.fillRect(bX, bY, bW, bH);
          ctx.fillStyle = blossomLight;
          ctx.fillRect(bX + 2 * scale, bY + 2 * scale, bW - 4 * scale, bH - 4 * scale);
        }
      }

      // 🌲 Pine Evergreen Tree
      function drawPineTree(x, y, scale, dark) {
        ctx.fillStyle = dark ? '#16231A' : '#3D251D';
        ctx.fillRect(x, y, 6 * scale, 32 * scale);

        const pineDark = dark ? '#0E281C' : '#1C4931';
        const pineLight = dark ? '#183D2D' : '#2D6B48';

        for (let i = 0; i < 4; i++) {
          let tW = (28 - i * 5) * scale;
          let tH = 9 * scale;
          let tY = y - i * 8 * scale - 4 * scale;
          ctx.fillStyle = pineDark;
          ctx.fillRect(x - tW / 2 + 3 * scale, tY, tW, tH);
          ctx.fillStyle = pineLight;
          ctx.fillRect(x - tW / 2 + 5 * scale, tY, tW - 4 * scale, 3 * scale);
        }
      }

      // 🏔️ Snow-Capped Mountain Peak
      function drawSnowPeak(x, y, width, height) {
        ctx.fillStyle = '#3E506B';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + width / 2, y - height);
        ctx.lineTo(x + width, y);
        ctx.fill();

        // Pixel Snow Cap
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.moveTo(x + width * 0.35, y - height * 0.5);
        ctx.lineTo(x + width / 2, y - height);
        ctx.lineTo(x + width * 0.65, y - height * 0.5);
        ctx.lineTo(x + width * 0.5, y - height * 0.4);
        ctx.fill();
      }

      // 🍂 Autumn Maple Tree
      function drawAutumnMaple(x, y, scale, sway) {
        ctx.fillStyle = '#362217';
        ctx.fillRect(x, y, 7 * scale, 32 * scale);

        const mapleAmber = '#D95D22';
        const mapleGold = '#F4A228';
        const shift = Math.sin(sway) * 3 * scale;

        for (let i = 0; i < 4; i++) {
          let mW = (30 - i * 5) * scale;
          let mH = 10 * scale;
          let mY = y - i * 8 * scale - 5 * scale;
          let mX = x - mW / 2 + 3.5 * scale + shift * (i * 0.35);
          ctx.fillStyle = mapleAmber;
          ctx.fillRect(mX, mY, mW, mH);
          ctx.fillStyle = mapleGold;
          ctx.fillRect(mX + 3 * scale, mY + 2 * scale, mW - 6 * scale, mH - 4 * scale);
        }
      }

      function renderFrame() {
        ctx.clearRect(0, 0, w, h);
        tick += 0.025;
        const dark = state.settings.darkMode;
        const biome = state.settings.currentBiome;

        // ================= BIOME 1: 🌸 SAKURA BLOSSOM VALLEY =================
        if (biome === 'sakura') {
          let sky = ctx.createLinearGradient(0, 0, 0, h);
          sky.addColorStop(0, dark ? '#100D1A' : '#FDE8EE');
          sky.addColorStop(0.55, dark ? '#22162B' : '#F9D1DE');
          sky.addColorStop(1, dark ? '#341A38' : '#E8EEEC');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, w, h);

          // Rolling Hill Silhouette
          ctx.fillStyle = dark ? '#1A1426' : '#E0B5C6';
          ctx.beginPath();
          ctx.arc(w * 0.25, h * 0.8, w * 0.45, 0, Math.PI * 2);
          ctx.arc(w * 0.8, h * 0.85, w * 0.5, 0, Math.PI * 2);
          ctx.fill();

          // Swaying Sakura Trees
          drawSwayingSakura(w * 0.12, h * 0.65, 1.4, tick);
          drawSwayingSakura(w * 0.82, h * 0.68, 1.35, tick + 1);

          // Drifting Sakura Petals
          particles.forEach(p => {
            p.x += Math.cos(tick + p.pulse) * 0.7 + 0.8;
            p.y += p.vy * 0.85;
            if (p.y > h) { p.y = -10; p.x = Math.random() * w; }
            if (p.x > w) p.x = 0;
            ctx.fillStyle = dark ? 'rgba(255, 175, 200, 0.55)' : 'rgba(235, 125, 160, 0.75)';
            ctx.fillRect(p.x, p.y, p.size, p.size * 0.8);
          });
        }

        // ================= BIOME 2: 🌲 TAIGA FIREFLY FOREST =================
        else if (biome === 'taiga') {
          let sky = ctx.createLinearGradient(0, 0, 0, h);
          sky.addColorStop(0, dark ? '#080E14' : '#8CBCCE');
          sky.addColorStop(0.65, dark ? '#102220' : '#B8D8E4');
          sky.addColorStop(1, dark ? '#183830' : '#DBEEF4');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, w, h);

          // Deep Pine Layers
          for (let x = -20; x < w * 0.35; x += 32) {
            drawPineTree(x, h * 0.64 + (Math.abs(x) % 3) * 12, 1.4, dark);
          }
          for (let x = w * 0.65; x < w + 20; x += 32) {
            drawPineTree(x, h * 0.64 + (Math.abs(x) % 3) * 12, 1.4, dark);
          }

          // Glowing Hovering Fireflies
          particles.forEach(p => {
            p.x += Math.sin(tick * 1.5 + p.pulse) * 0.8;
            p.y += Math.cos(tick * 1.2 + p.pulse) * 0.6;
            let glow = 0.5 + Math.sin(tick * 3 + p.pulse) * 0.45;
            ctx.fillStyle = `rgba(160, 245, 140, ${glow})`;
            ctx.fillRect(p.x, p.y, p.size * 1.2, p.size * 1.2);
          });
        }

        // ================= BIOME 3: 🏔️ ALPINE SNOW MOUNTAINS =================
        else if (biome === 'mountain') {
          let sky = ctx.createLinearGradient(0, 0, 0, h);
          sky.addColorStop(0, dark ? '#0A1220' : '#6898B8');
          sky.addColorStop(0.6, dark ? '#162842' : '#9DC2DA');
          sky.addColorStop(1, dark ? '#264264' : '#D6EAF5');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, w, h);

          // Giant Snow Peaks
          drawSnowPeak(w * 0.05, h * 0.6, 220, 140);
          drawSnowPeak(w * 0.45, h * 0.62, 280, 170);

          // Heavy Pixel Snowstorm
          particles.forEach(p => {
            p.x += (p.vx - 1.2);
            p.y += p.vy * 1.6;
            if (p.y > h) { p.y = -10; p.x = Math.random() * w + 50; }
            if (p.x < 0) p.x = w;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(p.x, p.y, p.size, p.size);
          });
        }

        // ================= BIOME 4: 🍂 AUTUMN SUNSET RIDGE =================
        else {
          let sky = ctx.createLinearGradient(0, 0, 0, h);
          sky.addColorStop(0, dark ? '#1A0C16' : '#F6A882');
          sky.addColorStop(0.55, dark ? '#2D1620' : '#F78D74');
          sky.addColorStop(1, dark ? '#452026' : '#EE6E60');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, w, h);

          // Golden Autumn Foothills
          ctx.fillStyle = dark ? '#241416' : '#BD5838';
          ctx.beginPath();
          ctx.arc(w * 0.2, h * 0.85, w * 0.45, 0, Math.PI * 2);
          ctx.arc(w * 0.75, h * 0.88, w * 0.5, 0, Math.PI * 2);
          ctx.fill();

          // Amber Maple Trees
          drawAutumnMaple(w * 0.1, h * 0.65, 1.4, tick);
          drawAutumnMaple(w * 0.84, h * 0.68, 1.35, tick + 1.5);

          // Tumbling Autumn Leaves
          particles.forEach(p => {
            p.x += Math.sin(tick + p.pulse) * 1.1 + 0.6;
            p.y += p.vy * 0.95;
            if (p.y > h) { p.y = -10; p.x = Math.random() * w; }
            ctx.fillStyle = (Math.floor(p.pulse) % 2 === 0) ? '#D9521E' : '#F2A426';
            ctx.fillRect(p.x, p.y, p.size, p.size * 0.7);
          });
        }

        requestAnimationFrame(renderFrame);
      }
      renderFrame();
    }

    function playTone(freq, dur) {
      if (!state.settings.soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function playFanfare() {
      if (!state.settings.soundEnabled) return;
      [587.33, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playTone(freq, 0.3), i * 130);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, t => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[t] || t));
    }
  </script>
