<html lang="en">
<head>

    <title>Purrmodoro 🐾 Study with Melog</title>

    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

    <style>
        /* 1. Cycle Dots to Clean Paw Prints */
        .tomato-dot {
            border-radius: 0 !important;
            background-color: transparent !important;
            width: 22px !important; 
            height: 22px !important;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M12 13.5c-2.5 0-4.5 2-4.5 4.5s2 4.5 4.5 4.5 4.5-2 4.5-4.5-2-4.5-4.5-4.5z" /><ellipse cx="6" cy="11.5" rx="2" ry="3" transform="rotate(-30 6 11.5)"/><ellipse cx="9.5" cy="7.5" rx="2" ry="3" transform="rotate(-10 9.5 7.5)"/><ellipse cx="14.5" cy="7.5" rx="2" ry="3" transform="rotate(10 14.5 7.5)"/><ellipse cx="18" cy="11.5" rx="2" ry="3" transform="rotate(30 18 11.5)"/></svg>') !important;
            background-size: contain !important;
            background-repeat: no-repeat !important;
            opacity: 0.4;
        }
        .tomato-dot.active {
            opacity: 1;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23F28C28"><path d="M12 13.5c-2.5 0-4.5 2-4.5 4.5s2 4.5 4.5 4.5 4.5-2 4.5-4.5-2-4.5-4.5-4.5z" /><ellipse cx="6" cy="11.5" rx="2" ry="3" transform="rotate(-30 6 11.5)"/><ellipse cx="9.5" cy="7.5" rx="2" ry="3" transform="rotate(-10 9.5 7.5)"/><ellipse cx="14.5" cy="7.5" rx="2" ry="3" transform="rotate(10 14.5 7.5)"/><ellipse cx="18" cy="11.5" rx="2" ry="3" transform="rotate(30 18 11.5)"/></svg>') !important;
        }

        /* 2. MODE SWITCHER BUTTONS */
        .mode-switch-bar {
            display: flex; gap: 5px; background: rgba(0,0,0,0.08); padding: 5px; border-radius: 20px; margin-bottom: 10px;
        }
        .mode-btn {
            background: transparent; border: none; color: #555; font-family: var(--font-pixel); font-size: 0.8rem; padding: 6px 16px; border-radius: 15px; cursor: pointer; text-transform: uppercase; transition: all 0.2s;
        }
        body.theme-dark .mode-switch-bar { background: rgba(255,255,255,0.05); }
        body.theme-dark .mode-btn { color: #BBB; }
        .mode-btn.active {
            background: var(--btn-orange); color: #FFF !important; box-shadow: 0 2px 0 var(--btn-orange-shadow);
        }

        /* 3. TIMER MELOG ANIMATIONS (Dependent on Focus vs Break mode) */
        .melog-awake { display: block; }
        .melog-asleep { display: none; }
        
        body.mode-break .melog-awake { display: none; }
        body.mode-break .melog-asleep { display: block; }

        body.mode-break .orbit-arm .melog-sprite-box { transform: translateX(-50%) translateY(4px); }
        
        .zzz-container {
            position: absolute; top: -20px; right: -10px; font-family: var(--font-pixel); font-size: 0.8rem; color: #A6CFE2; opacity: 0; pointer-events: none;
        }
        body.mode-break .zzz-container { opacity: 1; animation: floatZzz 3s infinite linear; }
        @keyframes floatZzz {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-20px) scale(1.2) translateX(10px); opacity: 0; }
        }

        /* Tail always wags when awake */
        body:not(.mode-break) .orbit-arm .px-balanced-tail {
            animation: attachedTailSway 0.54s infinite ease-in-out; transform-origin: 3px 6px;
        }

        /* Legs and body bounce ONLY when timer is running AND in focus mode */
        body.timer-running:not(.mode-break) .orbit-arm .px-cat-master { animation: catHopBounding 0.54s infinite cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 8px 11px; }
        body.timer-running:not(.mode-break) .orbit-arm .px-leg-fl { animation: strideFrontLeft 0.54s infinite cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 8px 8px; }
        body.timer-running:not(.mode-break) .orbit-arm .px-leg-fr { animation: strideFrontRight 0.54s infinite cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 8px 8px; }
        body.timer-running:not(.mode-break) .orbit-arm .px-leg-bl { animation: strideBackLeft 0.54s infinite cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 4px 8px; }
        body.timer-running:not(.mode-break) .orbit-arm .px-leg-br { animation: strideBackRight 0.54s infinite cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 4px 8px; }

        /* 4. SANCTUARY ROOM & SMART EMOJI PLACEMENT */
        .sanctuary-room-stage {
            height: 220px !important; background: linear-gradient(to bottom, #d6e8f5 60%, #b5ccdf 60%, #b5ccdf 63%, #a27b6c 63%, #a27b6c 100%) !important; border: 4px solid rgba(0,0,0,0.15) !important; position: relative; display: block !important;
        }
        .pixel-poster { position: absolute; top: 15px; left: 15px; width: 25px; height: 35px; background: white; border: 2px solid #555; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        .pixel-cross { width: 14px; height: 14px; background: #ff6b6b; clip-path: polygon(33% 0, 66% 0, 66% 33%, 100% 33%, 100% 66%, 66% 66%, 66% 100%, 33% 100%, 33% 66%, 0 66%, 0 33%, 33% 33%); }
        .pixel-window { position: absolute; top: 20px; right: 25px; width: 40px; height: 50px; background: #87CEEB; border: 3px solid #FFF; box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 2px 2px 0 rgba(0,0,0,0.1); overflow: hidden; }
        .pixel-window::after { content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: #FFF; }
        .pixel-window::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: #FFF; }
        .pixel-desk { position: absolute; bottom: 30px; right: 15px; width: 110px; height: 50px; background: #D2B48C; border-top: 4px solid #C19A6B; border-left: 3px solid #8B5A2B; border-right: 3px solid #8B5A2B; box-shadow: -5px 10px 0 rgba(0,0,0,0.08); z-index: 2; }
        .pixel-desk::before, .pixel-desk::after { content: ''; position: absolute; top: 100%; width: 8px; height: 30px; background: #5C4033; }
        .pixel-desk::before { left: 5px; } .pixel-desk::after { right: 5px; }

        #sanctuary-placed-items { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
        .placed-item-emoji { position: absolute; pointer-events: auto; display: inline-block; line-height: 1; text-shadow: 2px 2px 0 rgba(0,0,0,0.15); }
        #sanctuary-placed-items > :nth-child(1) { right: 25px; bottom: 75px; font-size: 1.5rem; } 
        #sanctuary-placed-items > :nth-child(2) { left: 10px; bottom: 25px; font-size: 2.2rem; } 
        #sanctuary-placed-items > :nth-child(3) { right: 100px; bottom: 25px; font-size: 2.5rem; } 
        #sanctuary-placed-items > :nth-child(4) { left: 45%; top: 10px; font-size: 1.8rem; } 
        #sanctuary-placed-items > :nth-child(5) { right: 15px; top: 15px; font-size: 2rem; } 
        #sanctuary-placed-items > :nth-child(6) { left: 35%; bottom: 15px; font-size: 1.8rem; } 
        #sanctuary-placed-items > :nth-child(7) { right: 55px; bottom: 75px; font-size: 1.5rem; } 
        #sanctuary-placed-items > :nth-child(8) { left: 15px; top: 15px; font-size: 1.8rem; } 
        #sanctuary-placed-items > :nth-child(9) { left: 70px; bottom: 25px; font-size: 2rem; } 
        #sanctuary-placed-items > :nth-child(10) { right: 130px; bottom: 25px; font-size: 2.2rem; }

        /* 5. INDEPENDENT WALKING ANIMATION FOR SANCTUARY MELOG (Walks 24/7) */
        .sanctuary-room-stage .sanctuary-pet {
            position: absolute !important; bottom: 25px !important; width: 60px !important; height: 60px !important; z-index: 5 !important;
            animation: wanderMelog 14s infinite linear !important; transform: none !important; margin: 0 !important;
        }
        .sanctuary-room-stage .sanctuary-pet .px-cat-master { animation: catHopBounding 1.2s infinite cubic-bezier(0.4, 0, 0.2, 1) !important; transform-origin: 8px 11px; }
        .sanctuary-room-stage .sanctuary-pet .px-leg-fl { animation: strideFrontLeft 1.2s infinite !important; transform-origin: 8px 8px; }
        .sanctuary-room-stage .sanctuary-pet .px-leg-fr { animation: strideFrontRight 1.
